<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 St. Stephen's Girls' College - 120th Anniversary Open Day Fortune Mystery Box 🎁</title>
    <!-- Canvas-Confetti 絲帶與彩帶特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background: #f0f2f5;
            padding-top: 30px;
            margin: 0;
            overflow-x: hidden;
        }

        /* 頂部校名與標題容器 */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
        }

        /* 校徽與校名 (並排版面) */
        .school-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .school-badge {
            height: 65px;
            width: auto;
            object-fit: contain;
        }

        .school-name {
            text-align: left;
            color: #1a365d;
        }

        .school-name-en {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.2;
        }

        .school-name-zh {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.2;
        }

        /* 大會主題 */
        .main-title {
            color: #1a365d;
            font-size: 24px;
            font-weight: bold;
            margin: 8px 0 4px 0;
        }

        .main-title sup {
            font-size: 0.65em;
            vertical-align: super;
        }

        /* 活動名稱 */
        .box-title {
            color: #2b6cb0;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #4a5568;
            font-size: 15px;
            margin-bottom: 15px;
        }
        
        /* 盲盒容器 */
        .box-container {
            margin: 30px auto 20px auto;
            width: 220px;
            height: 220px;
            cursor: pointer;
            position: relative;
        }
        
        /* 盲盒本體 */
        .box {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: 4px solid #f6ad55;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 50px;
            font-weight: bold;
            box-shadow: 0 15px 30px rgba(30, 60, 114, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            z-index: 2;
        }
        .box:hover {
            transform: scale(1.04);
            box-shadow: 0 20px 35px rgba(30, 60, 114, 0.5);
        }

        /* 彈出圖片 Pop-up Image Card */
        .prize-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 280px;
            max-width: 85vw;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #ffffff;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 3px solid #f6ad55;
        }

        /* 盲盒打開後 Pop-up 浮出放大效果 */
        .prize-popup.active {
            transform: translate(-50%, -105%) scale(1.05);
            opacity: 1;
        }

        .prize-popup img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }

        .prize-title {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #1a365d;
        }

        /* 劇烈搖晃動畫 */
        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            10% { transform: translate(-3px, -2px) rotate(-3deg); }
            20% { transform: translate(-4px, 0px) rotate(3deg); }
            30% { transform: translate(3px, 3px) rotate(0deg); }
            40% { transform: translate(2px, -2px) rotate(3deg); }
            50% { transform: translate(-2px, 3px) rotate(-3deg); }
