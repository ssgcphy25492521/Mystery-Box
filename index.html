<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 St. Stephen's Girls' College - 120th Anniversary Open Day Fortune Mystery Box 🎁</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background: #f0f2f5;
            padding-top: 30px;
            margin: 0;
            overflow-x: hidden;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
        }

        .school-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .school-badge {
            height: 70px;
            width: 70px;
            object-fit: contain;
            background-color: transparent; 
            border-radius: 50%;
        }

        .school-name {
            text-align: center;
            color: #1a365d;
        }

        .school-name-en {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.25;
        }

        .school-name-zh {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.25;
        }

        .main-title {
            color: #1a365d;
            font-size: 24px;
            font-weight: bold;
            margin: 12px 0 6px 0;
        }

        .main-title sup {
            font-size: 0.65em;
            vertical-align: super;
        }

        .box-title {
            color: #2b6cb0;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #4a5568;
            font-size: 15px;
            margin-bottom: 15px;
        }
        
        .box-container {
            margin: 30px auto 20px auto;
            width: 220px;
            height: 220px;
            cursor: pointer;
            position: relative;
        }
        
        .box {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: 4px solid #f6ad55;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 30px rgba(30, 60, 114, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            z-index: 2;
            overflow: hidden;
            padding: 15px;
            box-sizing: border-box;
        }
        .box:hover {
            transform: scale(1.04);
            box-shadow: 0 20px 35px rgba(30, 60, 114, 0.5);
        }

        .box-logo {
            max-width: 100%;
            max-height: 100%;
            min-width: 100px;
            min-height: 100px;
            object-fit: contain;
            border-radius: 12px;
            pointer-events: none;
        }

        .prize-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 280px;
            max-width: 85vw;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #ffffff;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 3px solid #f6ad55;
        }

        .prize-popup.active {
            transform: translate(-50%, -105%) scale(1.05);
            opacity: 1;
        }

        .prize-popup img {
            width: 100%;
            height: auto;
            min-height: 150px;
            border-radius: 10px;
            display: block;
            object-fit: contain;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            10% { transform: translate(-3px, -2px) rotate(-3deg); }
            20% { transform: translate(-4px, 0px) rotate(3deg); }
            30% { transform: translate(3px, 3px) rotate(0deg); }
            40% { transform: translate(2px, -2px) rotate(3deg); }
            50% { transform: translate(-2px, 3px) rotate(-3deg); }
            60% { transform: translate(-4px, 2px) rotate(0deg); }
            70% { transform: translate(3px, 2px) rotate(-3deg); }
            80% { transform: translate(-2px, -2px) rotate(3deg); }
            90% { transform: translate(3px, 3px) rotate(0deg); }
            100% { transform: translate(2px, -2px) rotate(0deg); }
        }
        .shaking {
            animation: shake 0.25s infinite;
            pointer-events: none;
        }

        .btn {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 6px 18px rgba(56, 161, 105, 0.4);
            transition: all 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(56, 161, 105, 0.5);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn:disabled {
            background: #cbd5e0 !important;
            box-shadow: none;
            cursor: not-allowed;
        }

        #result {
            margin-top: 25px;
            font-size: 24px; /* Slightly larger text for emphasis */
            font-weight: bold;
            color: #e53e3e; /* Changed to an exciting red/orange color */
            min-height: 40px;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="school-header">
            <img src="School badge.png" alt="School Badge" class="school-badge">
            <div class="school-name">
                <div class="school-name-en">St. Stephen’s Girls’ College</div>
                <div class="school-name-zh">聖士提反女子中學</div>
            </div>
        </div>

        <h1 class="main-title">120<sup>th</sup> Anniversary Open Day 一百二十周年校慶開放日</h1>

        <div class="box-title">🎁 幸運盲盒 Fortune Mystery Box 🎁</div>
        <div class="subtitle">點擊盲盒或按下開盒按鈕 Click box or button to open</div>
    </div>

    <!-- The Box Cover remains the 120 logo -->
    <div class="box-container" id="boxContainer" onclick="openBox()">
        <div class="box" id="blindBox">
            <img src="120 logo.jpg" alt="120 Logo" class="box-logo">
        </div>
        
        <!-- The popup image that shows the souvenir -->
        <div class="prize-popup" id="prizePopup">
            <img id="popupImg" src="" alt="Prize Graphic">
        </div>
    </div>

    <button class="btn" id="drawBtn" onclick="openBox()">隨機開盒 Open Box</button>

    <div id="result"></div>

    <script>
        // Updated to use the 4 souvenir image files. 
        // Adjust the 'weight' to make certain souvenirs more rare (higher number = more common).
        const prizes = [
            { image: "S1.png", weight: 25 },
            { image: "S2.png", weight: 25 },
            { image: "S3.png", weight: 25 },
            { image: "S4.png", weight: 25 }
        ];

        let isDrawing = false;
        
        const box = document.getElementById('blindBox');
        const drawBtn = document.getElementById('drawBtn');
        const resultDiv = document.getElementById('result');
        const prizePopup = document.getElementById('prizePopup');
        const popupImg = document.getElementById('popupImg');

        function openBox() {
            if (isDrawing) return;
            isDrawing = true;
            
            prizePopup.classList.remove('active');
            
            drawBtn.disabled = true;
            resultDiv.style.color = "#2b6cb0"; 
            resultDiv.innerHTML = "抽獎中... Opening...";
            
            box.classList.add('shaking');

            setTimeout(() => {
                box.classList.remove('shaking');
                const wonPrize = drawPrize();
                showResult(wonPrize);
            }, 1500);
        }

        function drawPrize() {
            const totalWeight = prizes.reduce((sum, prize) => sum + prize.weight, 0);
            let randomNum = Math.random() * totalWeight;
            
            for (let prize of prizes) {
                if (randomNum < prize.weight) {
                    return prize;
                }
                randomNum -= prize.weight;
            }
            return prizes[prizes.length - 1]; 
        }

        function showResult(prize) {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#1a365d', '#2b6cb0', '#f6ad55', '#e2e8f0']
            });

            // Set the popup to show the S1/S2/S3/S4 image
            popupImg.src = prize.image;
            
            prizePopup.classList.add('active');

            // Simplified text with no prize name
            resultDiv.style.color = "#e53e3e";
            resultDiv.innerHTML = `🎉 恭喜獲得 / Congratulations! 🎉`;
            
            isDrawing = false;
            drawBtn.disabled = false;
            drawBtn.textContent = "再次開盒 Play Again";
        }
    </script>
</body>
</html>
